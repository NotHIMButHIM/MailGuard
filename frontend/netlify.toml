[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Clean URL redirects
[[redirects]]
  from = "/login"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/portal/employee"
  to = "/portal/employee.html"
  status = 200

[[redirects]]
  from = "/portal/admin"
  to = "/portal/admin.html"
  status = 200

# Optional Reverse Proxy to Render backend (Avoids all CORS issues):
# Replace https://mailguard-backend.onrender.com with your actual Render service URL
# [[redirects]]
#   from = "/api/*"
#   to = "https://mailguard-backend.onrender.com/api/:splat"
#   status = 200
#   force = true
