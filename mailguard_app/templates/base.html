<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mailguard Security Gateway{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <script>
        (function() {
            const theme = localStorage.getItem("mailguard_theme") || "dark";
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg border-bottom border-secondary border-opacity-25 px-4 py-3 glass-panel rounded-0">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-2" href="/">
                <i class="bi bi-shield-lock-fill text-info fs-4"></i>
                <span class="brand-gradient fs-5 tracking-wide">MAILGUARD</span>
            </a>
            <div class="d-flex align-items-center gap-3">
                {% block nav_items %}{% endblock %}
                <button type="button" onclick="toggleTheme()" class="theme-toggle-btn btn-sm" title="Toggle Theme">
                    <i class="theme-toggle-icon bi bi-sun-fill"></i>
                </button>
                <span id="user-badge" class="badge bg-dark border border-secondary text-info px-3 py-2"></span>
                <button onclick="logout()" class="btn btn-outline-danger btn-sm px-3">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <main class="container-fluid py-4 px-4">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const userStr = localStorage.getItem("mailguard_user");
            if (userStr) {
                try {
                    const u = JSON.parse(userStr);
                    const badge = document.getElementById("user-badge");
                    if (badge) badge.innerText = (u.email || "") + " (" + (localStorage.getItem("mailguard_role") || "USER") + ")";
                } catch(e) {}
            }
        });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
