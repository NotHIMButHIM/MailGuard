<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mailguard Security Gateway</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
    <script src="/static/js/main.js"></script>
    <script>
        if (!window.getAuthToken) {
            window.getAuthToken = function() {
                let token = localStorage.getItem("mailguard_token");
                if (!token) {
                    const match = document.cookie.match(new RegExp("(^| )mailguard_token=([^;]+)"));
                    if (match) token = match[2];
                }
                return token;
            };
        }
        if (!window.getAuthRole) {
            window.getAuthRole = function() { return localStorage.getItem("mailguard_role") || "EMPLOYEE"; };
        }
        if (!window.setAuthSession) {
            window.setAuthSession = function(token, role, user) {
                localStorage.setItem("mailguard_token", token);
                localStorage.setItem("mailguard_role", role);
                if (user) localStorage.setItem("mailguard_user", typeof user === "string" ? user : JSON.stringify(user));
                document.cookie = "mailguard_token=" + token + "; path=/; SameSite=Lax";
            };
        }
        (function() {
            const theme = localStorage.getItem("mailguard_theme") || "dark";
            document.documentElement.setAttribute("data-theme", theme);
            document.documentElement.setAttribute("data-bs-theme", theme);
        })();
    </script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 position-relative">
    <div class="position-absolute top-0 end-0 p-4">
        <button type="button" onclick="toggleTheme()" class="theme-toggle-btn">
            <i class="theme-toggle-icon bi bi-sun-fill"></i>
            <span class="small">Theme</span>
        </button>
    </div>
    <div class="container" style="max-width: 480px;">
        <div class="text-center mb-4">
            <i class="bi bi-shield-lock-fill text-info fs-1"></i>
            <h2 class="brand-gradient mt-2 mb-1">MAILGUARD</h2>
            <p class="text-muted small">Enterprise Email Security & Threat Isolation Gateway</p>
        </div>

        <div class="glass-panel p-4 shadow-lg">
            <ul class="nav nav-tabs nav-fill mb-4" id="loginTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="employee-tab" type="button" onclick="switchTab('EMPLOYEE')">
                        <i class="bi bi-person-fill me-1"></i> Employee Portal
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="admin-tab" type="button" onclick="switchTab('ADMIN')">
                        <i class="bi bi-shield-shaded me-1"></i> Admin Portal
                    </button>
                </li>
            </ul>

            <div id="googleSection" class="mb-4">
                <a id="googleAuthLink"
                   href="https://accounts.google.com/o/oauth2/v2/auth?client_id={{ google_client_id }}&redirect_uri={{ google_redirect_uri }}&response_type=code&scope=openid%20email%20profile%20https://mail.google.com/&access_type=offline&prompt=consent&state=EMPLOYEE" 
                   class="btn btn-outline-light w-100 d-flex align-items-center justify-content-center gap-2 py-2 border-secondary border-opacity-50">
                    <svg width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Sign in with Google (Employee)</span>
                </a>
            </div>

            <div id="adminNotice" class="alert alert-info py-2 px-3 small border-0 bg-info bg-opacity-10 text-info mb-4 d-none d-flex align-items-center gap-2">
                <i class="bi bi-shield-lock-fill fs-5"></i>
                <span>Administrator accounts require authorized corporate credentials only.</span>
            </div>

            <div id="dividerSection" class="position-relative text-center my-4">
                <hr class="border-secondary border-opacity-25 my-0">
                <span class="position-absolute top-50 start-50 translate-middle px-3 bg-dark text-muted small">or corporate credentials</span>
            </div>

            <div id="error-alert" class="alert alert-danger py-2 small d-none" role="alert"></div>

            <form id="loginForm" onsubmit="handleLocalLogin(event)">
                <input type="hidden" id="selectedRole" value="EMPLOYEE">
                <div class="mb-3">
                    <label class="form-label text-muted small">Corporate Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" id="emailInput" class="form-control" placeholder="name@company.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-muted small">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" id="passwordInput" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="btn btn-info w-100 py-2 fw-semibold">
                    <span id="submitBtnText">Sign In to Employee Portal</span>
                    <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function switchTab(role) {
            const empTab = document.getElementById("employee-tab");
            const adminTab = document.getElementById("admin-tab");
            const googleSec = document.getElementById("googleSection");
            const dividerSec = document.getElementById("dividerSection");
            const adminNotice = document.getElementById("adminNotice");
            const submitBtnText = document.getElementById("submitBtnText");
            const selectedRole = document.getElementById("selectedRole");

            if (role === "ADMIN") {
                empTab.classList.remove("active");
                adminTab.classList.add("active");
                selectedRole.value = "ADMIN";
                if (googleSec) googleSec.classList.add("d-none");
                if (dividerSec) dividerSec.classList.add("d-none");
                if (adminNotice) adminNotice.classList.remove("d-none");
                if (submitBtnText) submitBtnText.innerText = "Sign In as Administrator";
            } else {
                adminTab.classList.remove("active");
                empTab.classList.add("active");
                selectedRole.value = "EMPLOYEE";
                if (googleSec) googleSec.classList.remove("d-none");
                if (dividerSec) dividerSec.classList.remove("d-none");
                if (adminNotice) adminNotice.classList.add("d-none");
                if (submitBtnText) submitBtnText.innerText = "Sign In to Employee Portal";
            }
        }

        async function handleLocalLogin(e) {
            e.preventDefault();
            const errorAlert = document.getElementById("error-alert");
            const submitBtn = document.getElementById("submitBtn");
            errorAlert.classList.add("d-none");
            submitBtn.disabled = true;

            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value;

            try {
                const res = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (!res.ok) {
                    throw new Error(data.detail || "Authentication failed");
                }

                window.setAuthSession(data.access_token, data.role, data.user);

                if (data.role === "ADMIN") {
                    window.location.href = "/portal/admin";
                } else {
                    window.location.href = "/portal/employee";
                }
            } catch (err) {
                errorAlert.innerText = err.message;
                errorAlert.classList.remove("d-none");
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
